{% macro flag(color, label=None, size=16) -%}
<span class="flag flag--{{ color }}">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" aria-hidden="true">
    <line class="flag__pole" x1="4" y1="1.5" x2="4" y2="15" stroke-width="1.6" stroke-linecap="round"/>
    <path class="flag__cloth" d="M4.8 2 L13.5 4.9 L4.8 7.8 Z"/>
  </svg>
  {{ label or VERDICTS[color] }}
</span>
{%- endmacro %}

{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' %}<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>
{%- elif name == 'finds' %}<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/><path d="M11 8v6M8 11h6"/>
{%- elif name == 'box' %}<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>
{%- elif name == 'scale' %}<path d="M12 3v18M5 21h14"/><path d="M4 8h16"/><path d="m4 8-2.5 6a3 3 0 0 0 5 0Z"/><path d="m20 8-2.5 6a3 3 0 0 0 5 0Z"/>
{%- elif name == 'chart' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'radar' %}<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/>
{%- elif name == 'gear' %}<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
{%- elif name == 'alert' %}<path d="M12 3 2 20h20Z"/><path d="M12 10v4.5M12 17.5v.01"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/>
{%- elif name == 'check' %}<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == 'external' %}<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'refresh' %}<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
{%- elif name == 'power' %}<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro kr_field(name, label, value, hint=None, required=False) -%}
<div class="field">
  <label for="{{ name }}">{{ label }}</label>
  <div class="suffix">
    <input type="text" inputmode="numeric" id="{{ name }}" name="{{ name }}"
           value="{{ value if value is not none else '' }}" autocomplete="off" {% if required %}required{% endif %}>
    <span>kr</span>
  </div>
  {% if hint %}<div class="hint">{{ hint }}</div>{% endif %}
</div>
{%- endmacro %}
